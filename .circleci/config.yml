# External, build-only config. Push enabled for the pinned source SHA and exact filtered branch.
version: 2.1
parameters:
  run-linux-verification:
    type: boolean
    default: true

jobs:
  verify-linux:
    docker:
      - image: cimg/python:3.12
      - image: pgvector/pgvector:pg16
        environment:
          POSTGRES_USER: heifang
          POSTGRES_PASSWORD: heifang
          POSTGRES_DB: heifang
    resource_class: medium
    working_directory: ~/linux-verification
    shell: /bin/bash -eo pipefail
    environment:
      SOURCE_REPOSITORY: Bill1231242/HeiFang
      SOURCE_COMMIT: df18e4f8ab783a4de59d6c9844a5dc13b8270bba
      UV_VERSION: "0.12.2"
      NODE_VERSION: "22.18.0"
      PNPM_VERSION: "10.28.1"
    steps:
      - checkout
      - add_ssh_keys:
          fingerprints:
            - "SHA256:vmxldrviCvW+ZfQfGqhGsRqxmMEkFZl9mUlP9Hc+UGw"
      - run:
          name: Verify exact source on Linux with real PostgreSQL
          no_output_timeout: 15m
          command: |
            env -i HOME="$HOME" USER="${USER:-circleci}" PATH="$PATH" \
              LANG=C.UTF-8 SSH_AUTH_SOCK="${SSH_AUTH_SOCK:-}" \
              SOURCE_REPOSITORY="$SOURCE_REPOSITORY" SOURCE_COMMIT="$SOURCE_COMMIT" \
              UV_VERSION="$UV_VERSION" NODE_VERSION="$NODE_VERSION" PNPM_VERSION="$PNPM_VERSION" \
              VERIFY_CONFIG_COMMIT="${CIRCLE_SHA1:-}" VERIFY_BUILD_URL="${CIRCLE_BUILD_URL:-}" \
              VERIFY_WORKFLOW_ID="${CIRCLE_WORKFLOW_ID:-}" \
              bash .circleci/run-linux-verification.sh
      - run:
          name: Save provenance and artifact checksums even after failure
          when: always
          command: |
            env -i HOME="$HOME" PATH="$PATH" SOURCE_COMMIT="$SOURCE_COMMIT" \
              VERIFY_CONFIG_COMMIT="${CIRCLE_SHA1:-}" VERIFY_BUILD_URL="${CIRCLE_BUILD_URL:-}" \
              VERIFY_WORKFLOW_ID="${CIRCLE_WORKFLOW_ID:-}" \
              python .circleci/ci_support.py provenance source-linux /tmp/heifang-linux-verification .circleci
      - store_test_results:
          path: /tmp/heifang-linux-verification/junit
      - store_artifacts:
          path: /tmp/heifang-linux-verification
          destination: linux-verification

workflows:
  linux-verification:
    when: << pipeline.parameters.run-linux-verification >>
    jobs:
      - verify-linux:
          filters:
            branches:
              only: build/linux-0.9.99-df18e4f8
            tags:
              ignore: /.*/
